name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}

# Least privilege: every job here only reads the checked-out tree. Without
# this block GITHUB_TOKEN inherits the repo-wide default scopes, which on a
# public repo can include write access to contents, issues, and packages.
# pull-requests: read is required by dorny/paths-filter to list changed files
# via the API on pull_request events (checkout is shallow, fetch-depth: 1).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      supabase_function: ${{ steps.filter.outputs.supabase_function }}
      supabase_migrations: ${{ steps.filter.outputs.supabase_migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'
            supabase_function:
              - 'supabase/functions/**'
              - '.github/workflows/ci.yml'
            supabase_migrations:
              - 'supabase/migrations/**'
              - 'supabase/ci/**'
              - '.github/workflows/ci.yml'
      - name: No tracked .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.[^.]+$)' | grep -v -E '\.env\.example$'; then
            echo "Tracked .env file found — remove it from git." >&2
            exit 1
          fi

  web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fails the build on a high/critical advisory in the lockfile.
      - run: npm audit --audit-level=high

  mobile:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The hosted runner's ~14 GB free disk runs out mid-Gradle on a debug
      # APK build ("No space left on device"). Drop preinstalled toolchains
      # this job never uses before building.
      - name: Free runner disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          df -h /
      - run: flutter build apk --debug

  supabase-function:
    needs: detect-changes
    if: needs.detect-changes.outputs.supabase_function == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2 (2.0.5)
        with:
          deno-version: 'v2.x'
      # Every function, not just generate-suggestion: the others were never
      # type-checked, linted or format-checked before.
      - run: deno check */index.ts _shared/*.ts
      - run: deno lint
      - run: deno fmt --check
      - run: deno test --allow-env _shared/

  rls-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.supabase_migrations == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mindbridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: mindbridge_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap minimal auth schema stub
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;

          create table auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb
          );

          create function auth.uid() returns uuid
            language sql stable
            as $$ select (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub')::uuid $$;

          grant usage on schema auth to public;
          grant execute on function auth.uid() to public;

          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role;
            end if;
            -- 0015_keepalive.sql and 0016 reference anon explicitly.
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon;
            end if;
          end
          $$;
          SQL

      - name: Apply migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Audit RLS coverage on all 8 tables
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            r record;
            missing text := '';
          begin
            for r in
              select t.table_name,
                     coalesce(c.relrowsecurity, false) as rls_enabled,
                     coalesce((select count(*) from pg_policies p
                               where p.schemaname = 'public' and p.tablename = t.table_name), 0) as policy_count
              from (values ('users'), ('mood_logs'), ('journal_entries'), ('coping_suggestions'), ('ai_call_logs'), ('activity_tags'), ('mood_log_activities'), ('weekly_summaries')) as t(table_name)
              left join pg_class c on c.relname = t.table_name and c.relnamespace = 'public'::regnamespace
            loop
              if not r.rls_enabled or r.policy_count = 0 then
                missing := missing || format('%s (rls_enabled=%s, policies=%s); ', r.table_name, r.rls_enabled, r.policy_count);
              end if;
            end loop;

            if missing <> '' then
              raise exception 'RLS audit failed for: %', missing;
            end if;

            raise notice 'RLS audit passed: all 8 tables have RLS enabled with policies.';
          end
          $$;
          SQL

      - name: RLS cross-user isolation test
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (email) values ('rls-test-a@mindbridge.test') returning id
          \gset a_
          insert into auth.users (email) values ('rls-test-b@mindbridge.test') returning id
          \gset b_

          -- Stash user A's id in a custom GUC so later DO blocks (dollar-quoted,
          -- so psql's :'var' substitution doesn't reach inside them) and the
          -- `authenticated` role (no SELECT grant on auth.users) can retrieve it.
          select set_config('test.user_a_id', :'a_id', false);

          -- Seed user A's data as postgres (superuser, bypasses RLS).
          insert into public.mood_logs (id, user_id, mood_score, mood_tag)
            values ('11111111-1111-1111-1111-111111111111', :'a_id', 5, 'calm');
          insert into public.journal_entries (id, mood_log_id, user_id, body)
            values ('22222222-2222-2222-2222-222222222222', '11111111-1111-1111-1111-111111111111', :'a_id', 'a private entry');
          insert into public.coping_suggestions (id, mood_log_id, user_id, technique_name, description, steps, model_used)
            values ('33333333-3333-3333-3333-333333333333', '11111111-1111-1111-1111-111111111111', :'a_id', 'Box breathing', 'desc', '["step1"]'::jsonb, 'claude-haiku');
          insert into public.ai_call_logs (id, user_id, input_tokens, output_tokens, latency_ms)
            values ('44444444-4444-4444-4444-444444444444', :'a_id', 10, 20, 500);
          insert into public.activity_tags (id, user_id, slug, label, emoji)
            values ('55555555-5555-5555-5555-555555555555', :'a_id', 'private-tag', 'Private Tag', '🔒');
          insert into public.mood_log_activities (mood_log_id, activity_tag_id, user_id)
            values ('11111111-1111-1111-1111-111111111111', '55555555-5555-5555-5555-555555555555', :'a_id');
          insert into public.weekly_summaries (id, user_id, week_start, summary)
            values ('66666666-6666-6666-6666-666666666666', :'a_id', '2026-01-05', 'a private summary');

          -- Switch to user A: positive control, so the test can't pass by
          -- accident from everything being blocked.
          set role authenticated;
          select set_config('request.jwt.claims', '{"sub": "' || :'a_id' || '"}', false);

          do $$
          declare
            missing text := '';
          begin
            if (select count(*) from public.mood_logs where id = '11111111-1111-1111-1111-111111111111') <> 1 then
              missing := missing || 'mood_logs; ';
            end if;
            if (select count(*) from public.journal_entries where id = '22222222-2222-2222-2222-222222222222') <> 1 then
              missing := missing || 'journal_entries; ';
            end if;
            if (select count(*) from public.coping_suggestions where id = '33333333-3333-3333-3333-333333333333') <> 1 then
              missing := missing || 'coping_suggestions; ';
            end if;
            if (select count(*) from public.ai_call_logs where id = '44444444-4444-4444-4444-444444444444') <> 1 then
              missing := missing || 'ai_call_logs; ';
            end if;
            if (select count(*) from public.activity_tags where id = '55555555-5555-5555-5555-555555555555') <> 1 then
              missing := missing || 'activity_tags; ';
            end if;
            if (select count(*) from public.mood_log_activities where mood_log_id = '11111111-1111-1111-1111-111111111111') <> 1 then
              missing := missing || 'mood_log_activities; ';
            end if;
            if (select count(*) from public.weekly_summaries where id = '66666666-6666-6666-6666-666666666666') <> 1 then
              missing := missing || 'weekly_summaries; ';
            end if;

            if missing <> '' then
              raise exception 'POSITIVE CONTROL FAILED: user A cannot see own rows in: %', missing;
            end if;
            raise notice 'Positive control passed: user A sees all own rows.';
          end
          $$;

          -- Switch to user B and confirm zero visibility into A's rows.
          select set_config('request.jwt.claims', '{"sub": "' || :'b_id' || '"}', false);

          do $$
          declare
            leaked text := '';
          begin
            if (select count(*) from public.mood_logs) <> 0 then leaked := leaked || 'mood_logs; '; end if;
            if (select count(*) from public.journal_entries) <> 0 then leaked := leaked || 'journal_entries; '; end if;
            if (select count(*) from public.coping_suggestions) <> 0 then leaked := leaked || 'coping_suggestions; '; end if;
            if (select count(*) from public.ai_call_logs) <> 0 then leaked := leaked || 'ai_call_logs; '; end if;
            if (select count(*) from public.activity_tags where user_id is not null) <> 0 then leaked := leaked || 'activity_tags; '; end if;
            if (select count(*) from public.mood_log_activities) <> 0 then leaked := leaked || 'mood_log_activities; '; end if;
            if (select count(*) from public.weekly_summaries) <> 0 then leaked := leaked || 'weekly_summaries; '; end if;

            if leaked <> '' then
              raise exception 'CROSS-USER LEAK: user B can see user A rows in: %', leaked;
            end if;
            raise notice 'Isolation confirmed: user B sees none of user A''s rows.';
          end
          $$;

          -- Built-in (user_id null) activity_tags remain visible to everyone --
          -- the one deliberate exception to "sees none of the other user's rows".
          do $$
          begin
            if (select count(*) from public.activity_tags where slug = 'school' and user_id is null) <> 1 then
              raise exception 'Built-in activity tag not visible to user B';
            end if;
            raise notice 'Built-in activity tags remain visible.';
          end
          $$;

          -- User B cannot insert a mood_log claiming to be user A. Reads A's id
          -- back from the test.user_a_id GUC rather than interpolating the psql
          -- :'a_id' variable, since psql does not substitute variables inside a
          -- dollar-quoted (DO $$ ... $$) block, and `authenticated` has no
          -- SELECT grant on auth.users to look it up directly.
          do $$
          declare
            a_id uuid := current_setting('test.user_a_id')::uuid;
          begin
            begin
              insert into public.mood_logs (user_id, mood_score, mood_tag) values (a_id, 6, 'calm');
              raise exception 'SECURITY FAILURE: user B inserted a mood_log as user A';
            exception
              when others then
                if sqlerrm like 'SECURITY FAILURE%' then
                  raise;
                end if;
                raise notice 'Insert-as-another-user correctly rejected: %', sqlerrm;
            end;
          end
          $$;

          reset role;
          select set_config('request.jwt.claims', '', false);
          SQL

      - name: Hardening assertions (migration 0016)
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/security_hardening_2.sql

  ci-success:
    needs: [detect-changes, web, mobile, supabase-function, rls-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded or were skipped
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
