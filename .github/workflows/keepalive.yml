name: Supabase keep-alive

# The free tier pauses a project after about a week with no traffic. This
# workflow calls public.keepalive() (migration 0015) every two days so the
# database always sees a real query. If the call fails, the job fails and
# GitHub emails the repo owner, which is the early warning that the project
# was paused anyway and has to be restored in the dashboard.
on:
  schedule:
    - cron: "17 15 */2 * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keepalive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
